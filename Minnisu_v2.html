<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Minissu.lk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;600;700&family=Noto+Sans+Tamil:wght@400;600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --g:#0b5d4b;--g2:#0f7a61;--gl:#e6f2ee;--acc:#e89a00;--accl:#fff4dc;
  --ink:#17201d;--mut:#5b6863;--bg:#f6f4ee;--card:#fff;--line:#e2ded4;
  --red:#b8382a;--redl:#fbe9e6;--ok:#1f8a4c;--rad:18px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:'Noto Sans Sinhala','Noto Sans Tamil','Inter',system-ui,sans-serif;font-size:18px;line-height:1.55;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
.app{max-width:580px;margin:0 auto;padding:12px 16px 110px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0 14px}
.logo{display:flex;align-items:center;gap:10px;cursor:pointer;background:none;border:0;padding:0}
.logo-mark{width:40px;height:40px;border-radius:12px;background:var(--g);display:grid;place-items:center}
.logo-txt{font-family:Inter,sans-serif;font-weight:700;font-size:20px;letter-spacing:-.3px;color:var(--g)}
.logo-txt span{color:var(--acc)}
.langs{display:flex;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px}
.langs button{border:0;background:none;padding:6px 11px;border-radius:999px;font-size:15px;cursor:pointer;min-width:40px}
.langs button.on{background:var(--g);color:#fff}
h1{font-size:30px;line-height:1.25;margin:6px 0 4px}
h2{font-size:23px;line-height:1.3;margin:4px 0 12px}
h3{font-size:19px;margin:16px 0 8px}
p{margin:6px 0}
.mut{color:var(--mut)}
.small{font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:16px;margin:12px 0}
.search{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid var(--line);border-radius:999px;padding:6px 6px 6px 18px;margin:16px 0}
.search:focus-within{border-color:var(--g2)}
.search input{flex:1;border:0;outline:0;background:none;min-width:0;padding:8px 0;font-size:18px}
.iconbtn{width:48px;height:48px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn.g{background:var(--g);color:#fff}
.iconbtn.l{background:var(--gl);color:var(--g)}
.big{display:flex;align-items:center;gap:16px;width:100%;text-align:left;border:0;border-radius:var(--rad);padding:20px;margin:12px 0;cursor:pointer;min-height:96px;box-shadow:0 1px 0 rgba(0,0,0,.04)}
.big .ic{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;flex:none;font-size:30px}
.big b{display:block;font-size:24px;line-height:1.25}
.big small{display:block;font-size:15px;opacity:.85}
.big.work{background:var(--g);color:#fff}.big.work .ic{background:rgba(255,255,255,.16)}
.big.find{background:#fff;color:var(--ink);border:2px solid var(--g)}.big.find .ic{background:var(--gl)}
.big.speak{background:var(--accl);color:var(--ink);border:2px dashed var(--acc)}.big.speak .ic{background:var(--acc);color:#fff}
.tag{text-align:center;color:var(--g);font-weight:600;margin:18px 0 4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;border:0;padding:14px 20px;font-weight:600;cursor:pointer;min-height:54px}
.btn.p{background:var(--g);color:#fff}.btn.p:disabled{opacity:.5;cursor:not-allowed}
.btn.s{background:#fff;color:var(--g);border:2px solid var(--g)}
.btn.t{background:none;color:var(--g);padding:10px 8px;min-height:auto}
.btn.w{width:100%}
.btn.wa{background:#1fa855;color:#fff}
.btn.danger{background:#fff;color:var(--red);border:2px solid var(--red)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row>.grow{flex:1}
label.f{display:block;font-weight:600;margin:14px 0 6px}
.inp{width:100%;border:2px solid var(--line);border-radius:14px;padding:13px 14px;background:#fff;outline:0;font-size:18px}
.inp:focus{border-color:var(--g2)}
textarea.inp{min-height:120px;resize:vertical}
.hint{font-size:15px;color:var(--mut);margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;cursor:pointer;font-size:16px}
.chip.on{border-color:var(--g);background:var(--gl);color:var(--g);font-weight:600}
.chip.sm{padding:4px 10px;font-size:14px;cursor:default}
.steps{display:flex;gap:6px;margin:4px 0 14px}
.steps i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--g)}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--g);font-weight:600;cursor:pointer;padding:6px 0;margin-bottom:4px}
.note{background:var(--accl);border-left:4px solid var(--acc);border-radius:10px;padding:10px 12px;font-size:15px;margin:10px 0}
.note.red{background:var(--redl);border-color:var(--red)}
.note.g{background:var(--gl);border-color:var(--g)}
.wcard{display:flex;gap:14px;align-items:flex-start;cursor:pointer}
.av{width:64px;height:64px;border-radius:16px;background:var(--gl);color:var(--g);display:grid;place-items:center;font-weight:700;font-size:26px;flex:none;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.av.lg{width:96px;height:96px;font-size:38px;border-radius:22px}
.wname{font-weight:700;font-size:19px;line-height:1.3}
.occ{color:var(--g);font-weight:600}
.meta{font-size:15px;color:var(--mut)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:middle}
.dot.on{background:var(--ok)}.dot.off{background:var(--red)}.dot.date{background:var(--acc)}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.badge{font-size:13px;border-radius:8px;padding:2px 8px;background:#f1efe9;color:var(--mut)}
.badge.ok{background:var(--gl);color:var(--g)}
.badge.demo{background:#ece8ff;color:#4b3aa8}
.why{font-size:13px;color:var(--mut);margin-top:6px}
.score{margin-left:auto;text-align:right;font-family:Inter,sans-serif;font-weight:700;color:var(--g);font-size:18px;flex:none}
.score small{display:block;font-weight:400;font-size:11px;color:var(--mut)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sw{position:relative;width:72px;height:40px;border-radius:999px;border:0;background:var(--red);cursor:pointer;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:32px;height:32px;border-radius:50%;background:#fff;transition:left .2s}
.sw.on{background:var(--ok)}.sw.on::after{left:36px}
.selfie{width:150px;height:150px;border-radius:24px;background:var(--gl);display:grid;place-items:center;overflow:hidden;margin:6px 0;border:2px dashed var(--g2)}
.selfie img{width:100%;height:100%;object-fit:cover}
.tabs{display:flex;gap:6px;margin-bottom:6px}
.tabs button{border:0;background:#f1efe9;border-radius:10px;padding:5px 12px;cursor:pointer;font-size:15px}
.tabs button.on{background:var(--g);color:#fff}
.orig{background:#f8f7f3;border-radius:12px;padding:10px 12px;font-size:16px;white-space:pre-wrap}
.modal{position:fixed;inset:0;background:rgba(20,28,25,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:var(--bg);width:100%;max-width:580px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 18px 28px}
@media(min-width:640px){.modal{align-items:center}.sheet{border-radius:24px}}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:14px;padding:12px 18px;font-size:16px;z-index:80;max-width:92vw;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.spin{display:inline-block;width:18px;height:18px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp 1s linear infinite}
.spin.d{border-color:rgba(11,93,75,.25);border-top-color:var(--g)}
@keyframes sp{to{transform:rotate(360deg)}}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cat{border:1px solid var(--line);background:#fff;border-radius:14px;padding:10px 6px;text-align:center;cursor:pointer;font-size:14px;line-height:1.3}
.cat .e{font-size:26px;display:block}
footer{font-size:13px;color:var(--mut);text-align:center;margin-top:28px;line-height:1.5}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
</style>
</head>

</div>

// ---------- Text matching ----------
function norm(s){ return String(s||'').toLowerCase().replace(/[‌‍]/g,'').replace(/\s+/g,' ').trim(); }
function latinTokens(s){ return (norm(s).match(/[a-z0-9\/]+/g)||[]); }
function lev(a,b){ if(a===b) return 0; const m=a.length,n=b.length; if(Math.abs(m-n)>1) return 2;
  let p=Array.from({length:n+1},(_,i)=>i);
  for(let i=1;i<=m;i++){ const c=[i]; for(let j=1;j<=n;j++) c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1)); p=c; }
  return p[n]; }
const isLatin = k => /^[\x00-\x7f]+$/.test(k);
function kwHit(text, toks, kw){
  const k = norm(kw);
  if(!isLatin(k)) return text.includes(k);
  if(k.includes(' ')) return (' '+toks.join(' ')+' ').includes(' '+k+' ');
  if(toks.includes(k)) return true;
  if(k.length>=5) return toks.some(x=>x.length>=4 && lev(x,k)<=1);
  return false;
}
function detectCats(q){
  const text=norm(q), toks=latinTokens(q); const hits=[];
  for(const c of CATS){ if(c.k.some(kw=>kwHit(text,toks,kw))) hits.push(c.id); }
  return hits;
}
function detectTowns(q){
  const text=norm(q), toks=latinTokens(q); const hits=[];
  for(const x of TOWNS){
    const names=[x.si,x.ta,x.en.toLowerCase(),...x.alt];
    if(names.some(nm=>nm && kwHit(text,toks,nm))) hits.push(x.id);
  }
  return hits;
}
function extractYears(s){
  const txt=norm(s);
  const re=[/(\d{1,2})\s*(?:ක|ක්)?\s*(?:අවුරුදු|වසර|years?|yrs?|avurudu|awurudu|ஆண்டு|வருட)/, /(?:අවුරුදු|වසර|avurudu|awurudu)\s*(\d{1,2})/];
  for(const r of re){ const m=txt.match(r); if(m) return +m[1]; }
  return null;
}
function km(a,b){ const R=6371,toR=Math.PI/180; const dl=(b.lat-a.lat)*toR, dg=(b.lng-a.lng)*toR;
  const h=Math.sin(dl/2)**2+Math.cos(a.lat*toR)*Math.cos(b.lat*toR)*Math.sin(dg/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }
function nearestTown(lat,lng){ let best=null,bd=1e9; for(const x of TOWNS){ const d=km({lat,lng},x); if(d<bd){bd=d;best=x;} } return best; }

// ---------- Ranking ----------
function allWorkers(){
  const map=new Map();
  for(const w of DEMO) map.set(w.id,w);
  for(const w of S.shared) map.set(w.id,w);
  if(S.me && !map.has(S.me.id)) map.set(S.me.id,S.me);
  return [...map.values()];
}
function rankWorkers(cats, townId, radius, opts={}){
  const base = townId ? TOWN[townId] : null;
  const out=[];
  for(const w of allWorkers()){
    if(cats.length && !w.cats.some(c=>cats.includes(c))) continue;
    if(opts.onlyAvail && w.avail!=='now') continue;
    if(opts.onlyPhoto && !w.selfie) continue;
    let dist=null;
    if(base){ const pts=[w.town,...(w.areas||[])].map(id=>TOWN[id]).filter(Boolean); if(pts.length) dist=Math.min(...pts.map(p=>km(base,p))); }
    const why=[]; let s=0;
    if(cats.length){ const primary=cats.includes(w.cats[0]); s+=primary?40:32; why.push('why_skill'); } else s+=20;
    if(base && dist!=null){ const r=Math.max(radius,5); const ds=dist<=r ? 25*(1-dist/(r*1.6)) : Math.max(0,8*(1-(dist-r)/50)); s+=ds; if(dist<=Math.min(10,r)) why.push('why_near'); }
    else s+=10;
    if(w.avail==='now'){ s+=15; why.push('why_avail'); } else if(w.avail==='date') s+=8;
    const v=(w.verif?.phone?4:0)+(w.verif?.selfie?3:0)+(w.selfie?3:0); s+=v; if(v>=3) why.push('why_ver');
    if(w.years){ s+=Math.min(w.years,15)/15*10; if(w.years>=5) why.push('why_exp'); }
    out.push({w,dist,score:Math.round(Math.min(s,100)),why});
  }
  out.sort((a,b)=>b.score-a.score || (a.dist??999)-(b.dist??999));
  if(!base) return {inside:out,outside:[]};
  return {inside:out.filter(r=>r.dist!=null && r.dist<=radius), outside:out.filter(r=>r.dist==null || r.dist>radius).sort((a,b)=>(a.dist??999)-(b.dist??999)).slice(0,5)};
}

  const r = await S.sample(prompt,{modelTier:'default'});

  return JSON.parse(m[0]);
}

- service_areas: choose only from these town ids, and only places the worker mentioned (a district name like Gampaha maps to its town id): ${TOWN_LIST}.
- Descriptions: 2 short plain sentences each, everyday words, no superlatives, written as the worker's service description. Sinhala in Sinhala script, Tamil in Tamil script.
- suggested_skills are optional ideas shown to the worker for approval; do not include them in skills.`;
    const r = await aiJSON(prompt);
    if(r && typeof r==='object'){
      usedAI=true;
      const cats=(Array.isArray(r.categories)?r.categories:[]).filter(id=>CAT[id]);
      const areas=(Array.isArray(r.service_areas)?r.service_areas:[]).filter(id=>TOWN[id] && id!==baseTown);
      let years = Number.isFinite(+r.years_experience) && r.years_experience!==null ? Math.round(+r.years_experience) : null;
      // provenance check: the number must appear in the worker's own words
      if(years!=null && !new RegExp('(^|\\D)'+years+'(\\D|$)').test(text)){ years=null; notes.push('aiYearsDrop'); }
      p = {
        cats: cats.length?cats:local.cats,
        skills:(Array.isArray(r.skills)?r.skills:[]).map(String).slice(0,6),
        years: years ?? local.years,
        areas: areas.length?areas:local.areas,
        desc:{si:String(r.description_si||local.desc.si),en:String(r.description_en||local.desc.en),ta:String(r.description_ta||local.desc.ta)},
        suggest:(Array.isArray(r.suggested_skills)?r.suggested_skills:[]).map(String).slice(0,4),
        confirm:(Array.isArray(r.needs_confirming)?r.needs_confirming:[]).map(String).slice(0,3),
      };
      if(!p.skills.length) p.skills=local.skills;
    }
  }catch(e){ /* fall through to local */ }
  if(!p){ p=local; notes.push('aiOff'); }
  p.usedAI=usedAI; p.notes=notes; p.yearsSrc = p.years!=null ? (text.match(new RegExp('[^.।\\n]*'+p.years+'[^.।\\n]*'))||[''])[0].trim() : '';
  return p;
}
function localProfile(text, baseTown){
  const cats=detectCats(text); const years=extractYears(text);
  const areas=detectTowns(text).filter(id=>id!==baseTown);
  // expand district mentions (e.g. "Gampaha") already map to town; keep as is
  const c=cats[0]?CAT[cats[0]]:null;
  const areaNames = l => [baseTown,...areas].filter(Boolean).map(id=>TOWN[id]?.[l]).filter(Boolean).join(', ');
  return {
    cats, years, areas,
    skills: cats.map(id=>CAT[id].en),
    desc:{
      si: c ? `${c.si} ලෙස සේවා සපයමි.${years?` වසර ${years}ක පළපුරුද්දක් ඇත.`:''}${areaNames('si')?` ${areaNames('si')} ප්‍රදේශවල වැඩ භාර ගනිමි.`:''}` : text,
      en: c ? `I work as a ${c.en.toLowerCase()}.${years?` ${years} years of experience.`:''}${areaNames('en')?` I take work in ${areaNames('en')}.`:''}` : text,
      ta: c ? `நான் ${c.ta} ஆக பணியாற்றுகிறேன்.${years?` ${years} ஆண்டு அனுபவம்.`:''}${areaNames('ta')?` ${areaNames('ta')} பகுதிகளில் வேலை செய்கிறேன்.`:''}` : text,
    },
    suggest:[], confirm:[],
  };
}
async function aiSearch(q){
  const prompt = `A customer on Minissu.lk (a Sri Lankan marketplace for skilled workers) typed this search, possibly in Sinhala, Tamil, English, Singlish, informal or misspelled:
"""${q.slice(0,500)}"""
Return ONLY JSON: {"categories":[ids],"town":town id or null,"summary_en":"one short sentence of what they need"}
Category ids: ${CAT_LIST}.
Town ids: ${TOWN_LIST}.
If unsure about the service, return an empty categories list. Do not guess a town that is not mentioned.`;
  const r = await aiJSON(prompt);
  return { cats:(r?.categories||[]).filter(id=>CAT[id]), town: TOWN[r?.town]?r.town:null, summary:String(r?.summary_en||'') };
}

// ---------- Voice ----------
function voiceInput(onText){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ toast(t('noVoice')); return; }
  try{
    const rec = new SR(); rec.lang = ({si:'si-LK',ta:'ta-LK',en:'en-LK'})[S.lang]; rec.interimResults=false; rec.maxAlternatives=1;
    rec.onresult = e => { const s=e.results?.[0]?.[0]?.transcript; if(s) onText(s); };
    rec.onerror = () => toast(t('noVoice'));
    rec.start(); toast(t('listening'));
  }catch(e){ toast(t('noVoice')); }
}
function speak(text){
  try{
    if(!('speechSynthesis' in window)) throw 0;
    const u=new SpeechSynthesisUtterance(text); u.lang=({si:'si-LK',ta:'ta-LK',en:'en-GB'})[S.lang];
    const vs=speechSynthesis.getVoices(); if(vs.length && !vs.some(v=>v.lang && v.lang.toLowerCase().startsWith(S.lang))) throw 0;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }catch(e){ toast(t('noVoice')); }
}

function readRegInputs(){
  const r=S.reg; const g=id=>document.getElementById(id);
  if(g('rName')) r.name=g('rName').value.trim();
  if(g('rPhone')) r.phone=g('rPhone').value.trim();
  if(g('rText')) r.text=g('rText').value;
  if(r.p){
    if(g('rSkills')) r.p.skills=g('rSkills').value.split(/[,،]/).map(s=>s.trim()).filter(Boolean);
    if(g('rYears')){ const v=g('rYears').value; r.p.years = v===''?null:Math.max(0,Math.min(60,Math.round(+v))); }
    if(g('rDesc')) r.p.desc[r.descTab]=g('rDesc').value;
  }
  if(g('rDate')) r.availDate=g('rDate').value;
  if(g('rShow')) r.showPhone=g('rShow').checked;
  if(g('rConsent')) r.consent=g('rConsent').checked;
}
async function regNext(){
  readRegInputs(); const r=S.reg; r.err='';
  if(S.regStep===0){
    if(!r.name){ r.err=t('name')+' ?'; return render(); }
    if(!validPhone(r.phone)){ r.err=t('phoneBad'); return render(); }
  }
  if(S.regStep===1 && !r.town){ toast(t('pickTown')); return; }
  if(S.regStep===3){
    if(r.text.trim().length<4){ r.err=t('describeHint'); return render(); }
    r.busy=true; render();
    r.p = await buildProfile(r.text, r.town);
    r.suggestOn=[]; r.descTab=S.lang; r.busy=false;
    // fold AI-detected service areas into selection
    for(const a of r.p.areas) if(!r.areas.includes(a)) r.areas.push(a);
  }
  if(S.regStep===4 && !r.p.cats.length){ toast(t('occupation')+' ?'); return; }
  if(S.regStep===5){
    if(!r.consent){ r.err=t('consent'); return render(); }
    if(r.avail==='date' && !r.availDate){ toast(t('fromDate')+' ?'); return; }
    return publish();
  }
  S.regStep=Math.min(REG_STEPS-1,S.regStep+1); render(); window.scrollTo(0,0);
}
async function publish(){
  const r=S.reg; r.busy=true; render();
  const skills=[...r.p.skills, ...r.suggestOn.map(i=>r.p.suggest[i])].filter((v,i,a)=>v&&a.indexOf(v)===i);
  const doc = {
    name:r.name.slice(0,60), phone:r.phone.replace(/[\s-]/g,''), showPhone:!!r.showPhone,
    cats:r.p.cats.slice(0,4), skills:skills.slice(0,10), years:r.p.years, desc:r.p.desc, original:r.text.slice(0,1500),
    town:r.town, areas:r.areas.slice(0,12), avail:r.avail, availDate:r.avail==='date'?r.availDate:'',
    selfie:r.selfie||null, verif:{phone:false,selfie:false}, aiUsed:!!r.p.usedAI, updated:new Date().toISOString(),
  };
  let shared=false;
  if(S.db && S.uid){
    try{ await S.db.doc('workers/'+S.uid).set(doc); shared=true; }catch(e){ shared=false; }
  }
  S.me = {...doc, id:S.uid||'local', mine:true};
  if(!shared){ try{ localStorage.setItem('mn_me',JSON.stringify(S.me)); }catch(e){} }
  r.busy=false; S.view='me'; render(); window.scrollTo(0,0);
  toast(shared?t('published'):t('saveLocal'));
}

  S.regStep=4; S.view='register'; render(); window.scrollTo(0,0);
}
function delMe(){
  openModal(`<h2>${esc(t('delSure'))}</h2><div class="row" style="margin-top:16px"><button class="btn danger grow" data-act="delYes">${esc(t('yesDel'))}</button><button class="btn s grow" data-act="closeModal">${esc(t('cancel'))}</button></div>`);
}
async function delYes(){
  closeModal();
  if(S.db && S.uid){ try{ await S.db.doc('workers/'+S.uid).delete(); }catch(e){} }
  try{ localStorage.removeItem('mn_me'); }catch(e){}
  S.me=null; S.view='home'; render(); toast(t('deleted'));
}

// ----- Find -----
function vFind(){
  const q=S.q;
  let resHtml='';
  if(q.busy) resHtml=`<div class="card row"><span class="spin d"></span> ${esc(t('searching'))}</div>`;
  else if(q.ran){
    if(!q.cats.length && q.text) resHtml+=`<div class="note">${esc(t('noCat'))}</div>`;
    const {inside,outside}=rankWorkers(q.cats,q.town,q.radius,{onlyAvail:q.onlyAvail,onlyPhoto:q.onlyPhoto});
    if(q.aiNote) resHtml+=`<div class="note g">🤖 ${esc(t('understood'))}: ${esc(q.aiNote)}</div>`;
    resHtml+=`<h3>${esc(t('results'))} (${inside.length})</h3>`;
    resHtml+= inside.length? inside.map(resultCard).join('') : `<div class="card mut">${esc(t('none'))}</div>`;
    if(q.town && outside.length && q.cats.length){ resHtml+=`<h3>📍 ${esc(t('nearbyT'))}</h3>`+outside.map(resultCard).join(''); }
  } else resHtml=`<p class="mut">${esc(t('typeSomething'))}</p><div class="cats">${CATS.slice(0,12).map(c=>`<button class="cat" data-act="catSearch" data-c="${c.id}"><span class="e">${c.e}</span>${esc(c[S.lang])}</button>`).join('')}</div>`;
  const catChips = q.cats.length ? `<div class="chips" style="margin:-4px 0 8px">${q.cats.map(id=>`<span class="chip on sm">${CAT[id].e} ${esc(cn(id))}</span>`).join('')}</div>` : '';
  return `<button class="back" data-act="home">← ${esc(t('back'))}</button>
  <h2>${esc(t('findTitle'))}</h2>
  <form class="search" data-form="findSearch" style="margin-top:4px">
    <input id="findQ" value="${esc(q.text)}" placeholder="${esc(t('searchPh'))}" autocomplete="off" aria-label="${esc(t('searchPh'))}">
    <button type="button" class="iconbtn l" data-act="micFind" aria-label="${esc(t('speak'))}">${micSvg()}</button>
    <button type="submit" class="iconbtn g" aria-label="search">${searchSvg}</button>
  </form>
  ${catChips}
  <div class="row">
    <select class="inp grow" id="fTown" aria-label="${esc(t('whereNeed'))}" style="min-width:180px">${townOptions(q.town,'📍 '+t('anyTown'))}</select>
  </div>
  ${q.town?`<div class="row" style="margin-top:10px"><span class="mut small">${esc(t('radius'))}:</span><div class="chips">${[5,10,25,50].map(r=>`<button class="chip ${q.radius===r?'on':''}" data-act="radius" data-r="${r}">${r} ${esc(t('km'))}</button>`).join('')}</div></div>`:''}
  <div class="chips" style="margin-top:10px">
    <button class="chip ${q.onlyAvail?'on':''}" data-act="fAvail">🟢 ${esc(t('onlyAvail'))}</button>
    <button class="chip ${q.onlyPhoto?'on':''}" data-act="fPhoto">📷 ${esc(t('onlyPhoto'))}</button>
  </div>
  ${S.sharedState==='slow'?`<div class="note small">⏳ ${esc(S.lang==='en'?'Registered profiles are still loading — results may be incomplete.':S.lang==='ta'?'பதிவுசெய்யப்பட்ட சுயவிவரங்கள் இன்னும் ஏற்றப்படுகின்றன.':'ලියාපදිංචි පැතිකඩ තවම පූරණය වෙමින් පවතී — ප්‍රතිඵල අසම්පූර්ණ විය හැක.')}</div>`:''}
  ${resHtml}`;
}
function resultCard(r){
  const w=r.w;
  return `<div class="card wcard" data-act="openW" data-id="${esc(w.id)}" role="button" tabindex="0">
    ${avatar(w)}
    <div style="flex:1;min-width:0">
      <div class="wname">${esc(w.name)}</div>
      <div class="occ">${w.cats.map(c=>esc(cn(c))).join(' · ')}</div>
      <div class="meta">📍 ${esc(tn(w.town))}${r.dist!=null?` · ${r.dist<1?'<1':Math.round(r.dist)} ${esc(t('km'))} ${esc(t('away'))}`:''}${w.years?` · ${w.years} ${esc(t('yrs'))}`:''}</div>
      <div class="meta">${availLine(w)}</div>
      <div class="badges">${badgesHtml(w)}</div>
      ${r.why.length?`<div class="why">✓ ${r.why.map(k=>esc(t(k))).join(' · ')}</div>`:''}
    </div>
    <div class="score">${r.score}<small>${esc(t('match'))}</small></div>
  </div>`;
}
async function runSearch(text){
  const q=S.q; q.text=(text??q.text).trim(); q.aiNote=''; q.ran=true;
  let cats=detectCats(q.text); const towns=detectTowns(q.text);
  if(towns.length) q.town=towns[0];
  if(!cats.length && q.text && S.sample){
    q.busy=true; render();
    try{ const a=await aiSearch(q.text); cats=a.cats; if(a.town && !towns.length) q.town=a.town; q.aiNote=a.summary; }catch(e){}
    q.busy=false;
  }
  q.cats=cats; S.view='find'; render();
}

// ----- Worker profile modal -----
function profileBody(w){
  const desc = w.desc?.[S.lang] || w.desc?.en || w.desc?.si || '';
  const phone = (!w.demo && w.showPhone && w.phone) ? w.phone : null;
  const intl = phone ? '94'+phone.replace(/^(\+94|94|0)/,'') : '';
  return `<div class="card">
    <div class="row" style="align-items:flex-start;gap:16px">${avatar(w,true)}
      <div style="flex:1;min-width:0"><div class="wname" style="font-size:22px">${esc(w.name)}</div>
      <div class="occ">${w.cats.map(c=>CAT[c]?CAT[c].e+' '+esc(cn(c)):'').join(' · ')}</div>
      <div class="meta">📍 ${esc(tn(w.town))} (${esc(t('approx'))})</div>
      <div class="meta">${availLine(w)}</div>
      ${w.years?`<div class="meta">🧰 ${w.years} ${esc(t('yrs'))}</div>`:''}
      <div class="badges">${badgesHtml(w)}</div></div></div>
    <p style="margin-top:14px">${esc(desc)}</p>
    ${w.skills?.length?`<h3>${esc(t('skills'))}</h3><div class="chips">${w.skills.map(s=>`<span class="chip sm">${esc(s)}</span>`).join('')}</div>`:''}
    ${w.areas?.length?`<h3>${esc(t('serviceAreas'))}</h3><div class="chips">${w.areas.map(a=>`<span class="chip sm">${esc(tn(a))}</span>`).join('')}</div>`:''}
    <h3>${esc(t('verif'))}</h3>
    <div class="small" style="line-height:1.8">⚪ ${esc(t('v_phone_no'))}<br>${w.selfie?'🟡 '+esc(t('v_selfie')):'⚪ '+esc(t('v_noselfie'))}<br>⚪ ${esc(t('v_id'))}<br>⚪ ${esc(t('v_qual'))}<br>⚪ ${esc(t('reviews'))}</div>
    ${w.demo?`<div class="note">${esc(t('demoNoContact'))}</div>`:''}
    ${phone?`<div class="row" style="margin-top:14px"><a class="btn p grow" href="tel:${esc(phone)}" style="text-decoration:none">📞 ${esc(t('call'))}</a><a class="btn wa grow" href="https://wa.me/${esc(intl)}" target="_blank" rel="noopener" style="text-decoration:none">💬 ${esc(t('whatsapp'))}</a></div><div class="hint" style="text-align:center">${esc(t('number'))}: ${esc(phone)}</div>`:''}
  </div>`;
}
function openW(id){
  const w=allWorkers().find(x=>x.id===id); if(!w) return;
  openModal(`<div class="row" style="justify-content:flex-end"><button class="btn t" data-act="closeModal">✕ ${esc(t('close'))}</button></div>${profileBody(w)}`);
}
function openModal(html){ $('#modal').innerHTML=`<div class="modal" data-act="modalBg"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`; }
function closeModal(){ $('#modal').innerHTML=''; }

// ---------- Image resize ----------
function resizeImage(file, max=240){
  return new Promise((res,rej)=>{
    const fr=new FileReader(); fr.onerror=rej;
    fr.onload=()=>{ const img=new Image(); img.onerror=rej; img.onload=()=>{
      const s=Math.min(img.width,img.height); const c=document.createElement('canvas'); c.width=c.height=max;
      c.getContext('2d').drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,max,max);
      res(c.toDataURL('image/jpeg',0.8)); }; img.src=fr.result; };
    fr.readAsDataURL(file);
  });
}

// ---------- Events ----------
function afterRender(){
  const ft=$('#fTown'); if(ft) ft.onchange=()=>{ S.q.town=ft.value; if(S.q.ran) render(); else render(); };
  const rt=$('#rTown'); if(rt) rt.onchange=()=>{ readRegInputs(); S.reg.town=rt.value; S.reg.areas=[]; render(); };
  const sf=$('#rSelfie'); if(sf) sf.onchange=async()=>{ const f=sf.files?.[0]; if(!f) return; try{ S.reg.selfie=await resizeImage(f); render(); }catch(e){ toast('⚠️'); } };
}
document.addEventListener('submit',e=>{
  const f=e.target.closest('[data-form]'); if(!f) return; e.preventDefault();
  if(f.dataset.form==='homeSearch'){ const v=$('#homeQ').value; S.q={...S.q,text:v,town:'',cats:[],ran:false}; S.view='find'; runSearch(v); }
  if(f.dataset.form==='findSearch'){ runSearch($('#findQ').value); }
});
document.addEventListener('keydown',e=>{ if(e.key==='Enter'){ const c=e.target.closest('[data-act="openW"]'); if(c) openW(c.dataset.id); } if(e.key==='Escape') closeModal(); });
document.addEventListener('click',e=>{
  const lb=e.target.closest('[data-lang]'); if(lb){ S.lang=lb.dataset.lang; try{localStorage.setItem('mn_lang',S.lang);}catch(_){}; if(S.reg) readRegInputs(); render(); return; }
  const el=e.target.closest('[data-act]'); if(!el) return;
  const a=el.dataset.act;
  if(a==='modalBg'){ if(e.target===el) closeModal(); return; }
  switch(a){
    case 'home': S.view='home'; location.hash=''; render(); break;
    case 'go': S.view=el.dataset.v; render(); window.scrollTo(0,0); break;
    case 'startReg': if(S.me){ S.view='me'; render(); break; } S.reg=newReg(); S.regStep=0; S.view='register'; render(); window.scrollTo(0,0); break;
    case 'regBack': readRegInputs(); if(S.regStep===0){ S.view='home'; } else S.regStep--; render(); break;
    case 'regNext': regNext(); break;
    case 'regSkip': S.regStep++; render(); break;
    case 'toggleArea': { readRegInputs(); const id=el.dataset.id, ar=S.reg.areas; const i=ar.indexOf(id); i>=0?ar.splice(i,1):ar.push(id); render(); break; }
    case 'gps': {
      try{ navigator.geolocation.getCurrentPosition(p=>{ const n=nearestTown(p.coords.latitude,p.coords.longitude); readRegInputs(); S.reg.town=n.id; render(); }, ()=>toast(t('gpsFail')), {timeout:8000}); }
      catch(_){ toast(t('gpsFail')); } break; }
    case 'example': S.reg.text=({si:'මම ගෙවල් පින්තාරු කරනවා. අවුරුදු 8ක පළපුරුද්ද තියෙනවා. කොළඹ සහ ගම්පහ ප්‍රදේශවල වැඩ කරනවා.',ta:'நான் வீடுகளுக்கு வர்ணம் பூசுகிறேன். 8 ஆண்டு அனுபவம். கொழும்பு மற்றும் கம்பஹா பகுதிகளில் வேலை செய்கிறேன்.',en:'I paint houses. 8 years experience. I work in Colombo and Gampaha areas.'})[S.lang]; render(); break;
    case 'micDesc': readRegInputs(); voiceInput(s=>{ S.reg.text=(S.reg.text?S.reg.text+' ':'')+s; render(); }); break;
    case 'micHome': voiceInput(s=>{ S.q={...S.q,text:s,town:'',cats:[],ran:false}; runSearch(s); }); break;
    case 'micFind': voiceInput(s=>runSearch(s)); break;
    case 'toggleCat': { readRegInputs(); const id=el.dataset.id, c=S.reg.p.cats; const i=c.indexOf(id); i>=0?c.splice(i,1):c.push(id); render(); break; }
    case 'toggleSug': { readRegInputs(); const i=+el.dataset.i, s=S.reg.suggestOn; const j=s.indexOf(i); j>=0?s.splice(j,1):s.push(i); render(); break; }
    case 'descTab': readRegInputs(); S.reg.descTab=el.dataset.l; render(); break;
    case 'readAloud': readRegInputs(); speak(S.reg.p.desc[S.reg.descTab]); break;
    case 'setAvail': readRegInputs(); S.reg.avail=el.dataset.v; render(); break;
    case 'toggleAvail': toggleAvail(); break;
    case 'editMe': editMe(); break;
    case 'delMe': delMe(); break;
    case 'delYes': delYes(); break;
    case 'closeModal': closeModal(); break;
    case 'catSearch': S.q={...S.q,text:'',cats:[el.dataset.c],ran:true,aiNote:''}; S.view='find'; render(); window.scrollTo(0,0); break;
    case 'radius': S.q.radius=+el.dataset.r; render(); break;
    case 'fAvail': S.q.onlyAvail=!S.q.onlyAvail; render(); break;
    case 'fPhoto': S.q.onlyPhoto=!S.q.onlyPhoto; render(); break;
    case 'openW': openW(el.dataset.id); break;
  }
});

// ---------- Platform capabilities (light up when available) ----------
function docToWorker(d){
  const x=d.data(); if(!x) return null;
  const cats=(Array.isArray(x.cats)?x.cats:[]).filter(c=>CAT[c]); if(!cats.length || !TOWN[x.town]) return null;
  const safeImg = typeof x.selfie==='string' && /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+\/=]+$/.test(x.selfie) ? x.selfie : null;
  return { id:d.id, name:String(x.name||'').slice(0,60), cats, skills:(Array.isArray(x.skills)?x.skills:[]).map(String).slice(0,10),
    years: Number.isFinite(x.years)?x.years:null, desc: (x.desc&&typeof x.desc==='object')?{si:String(x.desc.si||''),ta:String(x.desc.ta||''),en:String(x.desc.en||'')}:{si:'',ta:'',en:''},
    town:x.town, areas:(Array.isArray(x.areas)?x.areas:[]).filter(a=>TOWN[a]), avail:['now','date','off'].includes(x.avail)?x.avail:'off', availDate:String(x.availDate||''),
    phone: x.showPhone && validPhone(x.phone) ? String(x.phone) : null, showPhone:!!x.showPhone, selfie:safeImg, verif:{phone:false,selfie:false},
    original:String(x.original||''), aiUsed:!!x.aiUsed };
}
async function initPlatform(){
  if(!window.claude || typeof window.claude.use!=='function'){ S.sharedState='off'; loadLocalMe(); render(); return; }
  claude.use('sample').then(s=>{ S.sample=s||null; }).catch(()=>{});
  let user=null; try{ user=await claude.use('user'); }catch(e){}
  S.user=user;
  try{ S.uid = user ? await user.id() : null; }catch(e){ S.uid=null; }
  let db=null; try{ db=await claude.use('db'); }catch(e){}
  S.db=db;
  if(!db){ S.sharedState='off'; loadLocalMe(); render(); return; }
  const timer=setTimeout(()=>{ if(S.sharedState==='loading'){ S.sharedState='slow'; if(S.view==='find') render(); } },10000);
  db.collection('workers').onSnapshot(snap=>{
    const list=[]; for(const d of snap.docs){ const w=docToWorker(d); if(w) list.push(w); }
    S.shared=list;
    if(!snap.metadata.fromCache){ clearTimeout(timer); S.sharedState='ok'; }
    if(S.uid){ const mine=list.find(w=>w.id===S.uid); if(mine){ S.me={...mine,mine:true}; } }
    if(S.view!=='register') render();
  }, err=>{ clearTimeout(timer); S.sharedState='off'; loadLocalMe(); if(S.view!=='register') render(); });
}
function loadLocalMe(){ if(S.me) return; try{ const m=JSON.parse(localStorage.getItem('mn_me')||'null'); if(m && m.cats) S.me=m; }catch(e){} }

// ---------- Boot ----------
const h=(location.hash||'').replace('#','');
if(h==='find'||h==='register') { S.view = h==='register'?'home':'find'; }
render();
initPlatform();
</script>
